# SPDX-License-Identifier: LicenseRef-PYRAX-Proprietary
# Production stack for the PYRAX websites droplet (64.227.8.153).
# Each service has BOTH `image:` (CI pulls these from private GHCR) and `build:` (the droplet can build
# locally from source when the registry isn't wired yet). Caddy terminates TLS + routes the 4 domains.
#   first launch on the droplet:  docker compose build && docker compose up -d
#   CI updates:                    docker compose pull  && docker compose up -d
name: pyrax-web

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # The update-notification feed (updates.pyraxchain.com). Releases drop their
      # manifests/installers into this host dir under cli/ · node/ · ember/ · node-internal/.
      - /srv/updates:/srv/updates:ro
    depends_on:
      - website
      - nodes-website
      - explorer-web
      - explorer-indexer
      - peer-directory
      - team-pyrax
      - relay
      - faucet

  website:
    image: ghcr.io/pyrax-network/pyrax-web-website:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-website/Dockerfile
    restart: unless-stopped

  nodes-website:
    image: ghcr.io/pyrax-network/pyrax-web-nodes-website:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-nodes-website/Dockerfile
    restart: unless-stopped

  explorer-web:
    image: ghcr.io/pyrax-network/pyrax-web-explorer:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-explorer/Dockerfile
    restart: unless-stopped

  explorer-indexer:
    image: ghcr.io/pyrax-network/pyrax-web-explorer-indexer:${TAG:-latest}
    build:
      context: ./pyrax-explorer/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Ingest from the read-only PUBLIC seed RPC (a dedicated node, NOT the producer) so a
      # snappy poll cannot starve block production. Block time is ~5s; poll every 2.5s and
      # batch wider so the explorer stays within one block of the tip and catches up quickly
      # after a re-genesis re-index. The realtime feel is delivered by the explorer-web
      # WebSocket (it pushes each newly-ingested block to the browser instantly).
      RPC_881109: "https://sidn-rpc.pyraxchain.com:8811"
      INGEST_BATCH: "8"
      RECEIPT_CONCURRENCY: "2"
      INGEST_INTERVAL_MS: "2500"
      ALLOW_ORIGIN: "https://explorer.pyraxchain.com"
      # DigitalOcean Managed PostgreSQL (the indexer is now stateless — re-indexable).
      DATABASE_URL: "${DATABASE_URL_EXPLORER:?set DATABASE_URL_EXPLORER in .env}"
      DATABASE_CA: "${DATABASE_CA:-}"
      PG_POOL_MAX: "8"

  peer-directory:
    image: ghcr.io/pyrax-network/pyrax-web-peer-directory:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-peer-directory/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ORIGIN: "https://peers.pyraxchain.com"
      TRUST_PROXY: "1"
      PYRAX_DIRECTORY_SECRET: "${PYRAX_DIRECTORY_SECRET:?set PYRAX_DIRECTORY_SECRET in .env}"

  # Gated internal team portal (magic-link auth + RBAC). The Node server serves the
  # SPA + the API on :8790; SQLite (whitelist/roles/sessions) lives in the data volume.
  # Non-secret config is set here; secrets come from /opt/pyrax-web/.env (written by CI
  # from GitHub secrets). Missing secrets degrade gracefully (no presign / log-only email).
  team-pyrax:
    image: ghcr.io/pyrax-network/pyrax-web-team-pyrax:${TAG:-latest}
    build:
      context: ./team-pyrax
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: "https://team-pyrax.pyraxchain.com"
      OTA_BASE: "https://updates.pyraxchain.com"
      BREVO_SENDER_EMAIL: "noreply@pyraxchain.com"
      BREVO_SENDER_NAME: "PYRAX Team"
      # Internal test-token faucet (reached over the compose network). Signed-in users
      # request test PYRX in the portal's Faucet tab; the portal proxies to this service.
      FAUCET_BASE: "${FAUCET_BASE:-http://faucet:8800}"
      # DO Spaces (used only when the creds below are set -> presigned, gated downloads).
      SPACES_REGION: "${SPACES_REGION:-nyc3}"
      SPACES_BUCKET: "${SPACES_BUCKET:-pyrax-updates}"
      TRUST_PROXY: "1"
      # --- secrets (from .env; empty -> graceful fallback) ---
      SESSION_SECRET: "${SESSION_SECRET:-}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      SPACES_KEY: "${SPACES_KEY:-}"
      SPACES_SECRET: "${SPACES_SECRET:-}"
      # On-chain events relayer (`pyrax relay`): a login emits a gas-only event tx.
      # Empty -> graceful no-op (logins still work). Both must be set to enable.
      RELAY_BASE: "${RELAY_BASE:-}"
      PYRAX_RELAY_SECRET: "${PYRAX_RELAY_SECRET:-}"
      # DigitalOcean Managed PostgreSQL (state lives here — the container is stateless).
      DATABASE_URL: "${DATABASE_URL_TEAM_PYRAX:?set DATABASE_URL_TEAM_PYRAX in .env}"
      DATABASE_CA: "${DATABASE_CA:-}"
      PG_POOL_MAX: "5" # keep team-pyrax + explorer pools under the cluster's connection cap

  # Internal write-capable full node for chain 881109 (Internal Devnet 1.0). It PEERS
  # with the public seed/producer (204.48.16.184:30303) over the p2p mesh, syncs the
  # chain, and — crucially — SEALS the transactions submitted to it via RPC. A node only
  # gossips sealed BLOCKS to peers (it never re-broadcasts raw txs), so a non-sealing
  # follower's writes would never confirm; therefore this node runs `--role full` and
  # seals its own submitted txs, then GhostDAG merges its blocks with the producer's and
  # the two converge (the proven late-join scenario — no freeze). Its RPC is write-capable
  # (NO --rpc-public) and is NEVER published to the host: only the relay + faucet reach it
  # over the compose network at http://node:8545. The public seed's RPC stays read-only.
  # No directory announce — this is a private follower, not a publicly listed node. The
  # node image is built + pushed by pyrax-core (rpc-node-image.yml) and carries the uniform
  # genesis that pre-funds the marketing + faucet accounts.
  node:
    image: ghcr.io/pyrax-network/pyrax-node:latest
    restart: unless-stopped
    command:
      - "--network"
      - "internal-devnet-simulated"
      - "--datadir"
      - "/home/pyrax/pyrax-data"
      - "--rpc-bind"
      - "0.0.0.0" # in-container only; :8545 is NOT published to the host
      - "--rpc-port"
      - "8545"
      - "--p2p-port"
      - "30303"
      - "--rpc-cors"
      - "*"
      - "--role"
      # FULL miner: real distributed mining — this node mines alongside the producer
      # (GhostDAG merges their parallel blocks; difficulty retargets to hold the rate),
      # earns its OWN block rewards, AND serves the internal write RPC for the relay/faucet.
      - "full"
      - "--coinbase"
      - "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC" # this node's mining rewards (a dev account)
      - "--peer"
      # The producer's peer-id changes on every fresh re-genesis — keep this in sync.
      - "/ip4/204.48.16.184/tcp/30303/p2p/12D3KooWAtbb7fYz8sCGTrKSpg8ooeCFrP8MzAUfiBqLdZa4oJHm"
    volumes:
      # node_data10: FRESH volume. node_data9 held a chain on a DIVERGENT genesis (it
      # gossiped a parentless block whose hash != the producer's genesis), so on
      # reconnect the producer could not reconcile it and spun in a reorg/walk-back
      # loop that starved its seal loop. `Node::open` resumes a persisted chain without
      # revalidating its genesis against the current spec, so a stale/divergent datadir
      # wedges the mesh. Starting empty makes node B re-derive the matching genesis from
      # the image and sync the producer's chain cleanly. Bump this on EVERY producer
      # re-genesis (and any time node B may hold an incompatible chain).
      #
      # node_data12: bumped for the 2026-06 re-genesis (genesis_timestamp moved to
      # 1782341053). node_data10 held the PRE-re-genesis chain, so the write node was
      # orphaned on a stale genesis -> peer-dropped by the producer -> its seal loop
      # could not land relay/login/faucet/notification txs (explorer showed 0 txs).
      #
      # node_data13: bumped for the 2026-06-25 re-genesis (genesis_timestamp moved to
      # 1782395230, alongside the NAT-traversal + sync-hardening + protocol-gate release).
      # node_data12 held the PRE-re-genesis chain; a fresh volume makes the write node
      # re-derive the new genesis from the image and sync the producer's fresh chain.
      - node_data13:/home/pyrax/pyrax-data

  # On-chain events relayer (`pyrax relay`): team-pyrax logins + curated app
  # notifications become gas-only event txs on the newest live network. team-pyrax
  # reaches it internally at http://relay:8799 (RELAY_BASE). Idle until
  # PYRAX_RELAY_SECRET + PYRAX_KEY_PASSPHRASE are set (see relay/entrypoint.sh); on
  # start it imports the genesis-funded MARKETING spender (Anvil #1) — no funding tx
  # needed. It signs gas-only event txs and submits them to the internal write node
  # (relay.json -> http://node:8545). Keystore + relay state persist in the data volume.
  relay:
    image: ghcr.io/pyrax-network/pyrax-web-relay:${TAG:-latest}
    build:
      context: .
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    depends_on:
      - node
    environment:
      PYRAX_HOME: /data
      PYRAX_RELAY_SECRET: "${PYRAX_RELAY_SECRET:-}"
      PYRAX_KEY_PASSPHRASE: "${PYRAX_KEY_PASSPHRASE:-}"
    volumes:
      - relay_data:/data

  # Public test-token faucet (faucet.pyraxchain.com): dispenses test PYRX to any
  # address on the active dev network, rate-limited per-address + per-IP. Signs via
  # the bundled CLI + its own keystore key (auto-created; address logged to fund).
  # Idle until PYRAX_KEY_PASSPHRASE is set. NEVER point FAUCET_RPC at mainnet.
  faucet:
    image: ghcr.io/pyrax-network/pyrax-web-faucet:${TAG:-latest}
    build:
      context: .
      dockerfile: faucet/Dockerfile
    restart: unless-stopped
    depends_on:
      - node
    environment:
      PYRAX_HOME: /data
      PYRAX_KEY_PASSPHRASE: "${PYRAX_KEY_PASSPHRASE:-}"
      # Dispense through the internal WRITE-capable node (the public seed RPC is read-only).
      FAUCET_RPC: "${FAUCET_RPC:-http://node:8545}"
      FAUCET_NETWORK: "${FAUCET_NETWORK:-Internal Devnet 1.0}"
      FAUCET_DRIP_ASH: "${FAUCET_DRIP_ASH:-100000000000000000000}" # 100 PYRX
      FAUCET_WINDOW_H: "${FAUCET_WINDOW_H:-12}"
    volumes:
      - faucet_data:/data

volumes:
  caddy_data:
  caddy_config:
  node_data13:
  relay_data:
  faucet_data:
