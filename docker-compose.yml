# Production stack for the PYRAX websites droplet (64.227.8.153).
# Each service has BOTH `image:` (CI pulls these from private GHCR) and `build:` (the droplet can build
# locally from source when the registry isn't wired yet). Caddy terminates TLS + routes the 4 domains.
#   first launch on the droplet:  docker compose build && docker compose up -d
#   CI updates:                    docker compose pull  && docker compose up -d
name: pyrax-web

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - nodes-website
      - explorer-web
      - explorer-indexer
      - peer-directory
      - team-pyrax

  website:
    image: ghcr.io/pyrax-network/pyrax-web-website:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-website/Dockerfile
    restart: unless-stopped

  nodes-website:
    image: ghcr.io/pyrax-network/pyrax-web-nodes-website:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-nodes-website/Dockerfile
    restart: unless-stopped

  explorer-web:
    image: ghcr.io/pyrax-network/pyrax-web-explorer:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-explorer/Dockerfile
    restart: unless-stopped

  explorer-indexer:
    image: ghcr.io/pyrax-network/pyrax-web-explorer-indexer:${TAG:-latest}
    build:
      context: ./pyrax-explorer/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # THROTTLED ingest from the node's PUBLIC RPC so it can never starve the block producer.
      RPC_881109: "https://sidn-rpc.pyraxchain.com:8811"
      INGEST_BATCH: "2"
      RECEIPT_CONCURRENCY: "1"
      INGEST_INTERVAL_MS: "8000"
      ALLOW_ORIGIN: "https://explorer.pyraxchain.com"
    volumes:
      - explorer_data:/data

  peer-directory:
    image: ghcr.io/pyrax-network/pyrax-web-peer-directory:${TAG:-latest}
    build:
      context: .
      dockerfile: pyrax-peer-directory/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ORIGIN: "https://peers.pyraxchain.com"
      TRUST_PROXY: "1"
      PYRAX_DIRECTORY_SECRET: "${PYRAX_DIRECTORY_SECRET:?set PYRAX_DIRECTORY_SECRET in .env}"

  # Gated internal team portal (magic-link auth + RBAC). The Node server serves the
  # SPA + the API on :8790; SQLite (whitelist/roles/sessions) lives in the data volume.
  # Non-secret config is set here; secrets come from /opt/pyrax-web/.env (written by CI
  # from GitHub secrets). Missing secrets degrade gracefully (no presign / log-only email).
  team-pyrax:
    image: ghcr.io/pyrax-network/pyrax-web-team-pyrax:${TAG:-latest}
    build:
      context: ./team-pyrax
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: "https://team-pyrax.pyraxchain.com"
      OTA_BASE: "https://updates.pyraxchain.com"
      BREVO_SENDER_EMAIL: "noreply@pyraxchain.com"
      BREVO_SENDER_NAME: "PYRAX Team"
      # DO Spaces (used only when the creds below are set -> presigned, gated downloads).
      SPACES_REGION: "${SPACES_REGION:-nyc3}"
      SPACES_BUCKET: "${SPACES_BUCKET:-pyrax-updates}"
      TRUST_PROXY: "1"
      # --- secrets (from .env; empty -> graceful fallback) ---
      SESSION_SECRET: "${SESSION_SECRET:-}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      SPACES_KEY: "${SPACES_KEY:-}"
      SPACES_SECRET: "${SPACES_SECRET:-}"
      # DigitalOcean Managed PostgreSQL (state lives here — the container is stateless).
      DATABASE_URL: "${DATABASE_URL_TEAM_PYRAX:?set DATABASE_URL_TEAM_PYRAX in .env}"
      DATABASE_CA: "${DATABASE_CA:-}"

volumes:
  caddy_data:
  caddy_config:
  explorer_data:
