# SPDX-License-Identifier: LicenseRef-PYRAX-Proprietary
#
# Build pyrax-website (pyraxchain.com) and deploy it to the self-hosted websites VPS.
#
# On every push to main: install deps, build the static Vite site, then rsync the built dist/
# over SSH into the Caddy-served path on the VPS. Caddy serves the new files immediately — no
# reload is needed for static files. See DEPLOYMENT/03-deploy-main-website.md for the VPS-side
# one-time setup (deploy user, site dir, Caddy site block) and the SSH deploy-key wiring.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     the websites-VPS hostname or public IP
#   VPS_USER     the restricted deploy user on the VPS (e.g. deploy)
#   VPS_SSH_KEY  the PRIVATE half of the deploy key whose PUBLIC half is in that user's
#                ~/.ssh/authorized_keys on the VPS

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; cancel an in-flight run if a newer push lands.
concurrency:
  group: deploy-main-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist/ to the VPS
        run: |
          rsync -az --delete \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/pyrax-website/dist/"
