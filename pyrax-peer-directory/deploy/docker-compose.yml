#
# Standalone deploy of the PYRAX peer-directory behind Caddy (automatic HTTPS) at
# peers.pyraxchain.com. Run from this folder on the droplet:
#
#     cp .env.example .env   # then edit: set PYRAX_DIRECTORY_SECRET + your domain
#     docker compose up -d --build
#
# To co-locate on the existing RPC droplet (one server, one Caddy) instead, see
# DEPLOYMENT/04 — add just the `directory` service + a Caddy vhost to that stack.

services:
  directory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pyrax-peer-directory:latest
    restart: unless-stopped
    environment:
      - PORT=8787
      # MUST match the secret the PYRAX apps sign /api/announce with, or every
      # announce is rejected and no peers ever appear.
      - PYRAX_DIRECTORY_SECRET=${PYRAX_DIRECTORY_SECRET:?set PYRAX_DIRECTORY_SECRET in .env}
      - PYRAX_ENABLED_NETWORKS=${PYRAX_ENABLED_NETWORKS:-internal-devnet-simulated,devnet2,testnet,mainnet}
      - SITE_ORIGIN=https://${DIRECTORY_DOMAIN:-peers.pyraxchain.com}
      # Behind Caddy: honor X-Forwarded-For so the dial multiaddr is built from
      # the announcing node's REAL public IP, not Caddy's container IP.
      - TRUST_PROXY=1
    expose:
      - "8787"   # reached by Caddy on the compose network; not published to the host

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [directory]
    ports:
      - "80:80"     # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"   # the public TLS endpoint
    environment:
      - DIRECTORY_DOMAIN=${DIRECTORY_DOMAIN:-peers.pyraxchain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
