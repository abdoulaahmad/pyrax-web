<!DOCTYPE html>
<!-- SPDX-License-Identifier: LicenseRef-Proprietary -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PYRAX Network</title>
  <meta name="description" content="PYRAX Network — a shielded-by-default Layer-1 blockchain. Site under construction." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a1206 0%, #0b0b0f 55%, #060608 100%);
      color: #f5f5f7; text-align: center; padding: 2rem;
    }
    .wrap { max-width: 640px; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; letter-spacing: -.02em;
         background: linear-gradient(90deg,#ff7a1a,#ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #b9b9c2; font-size: 1.05rem; line-height: 1.6; margin: .25rem 0; }
    .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:#ff7a1a; margin-right:.5rem; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    a { color: #ffb347; text-decoration: none; }
    .foot { margin-top: 1.5rem; font-size: .85rem; color: #6b6b78; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PYRAX Network</h1>
    <p><span class="dot"></span>The new site is under construction.</p>
    <p>The Layer-1 network and its services are operating normally.</p>
    <p class="foot">Security contact: <a href="mailto:security@pyrax.org">security@pyrax.org</a> · <a href="/.well-known/security.txt">security.txt</a></p>
  </div>
</body>
</html>
