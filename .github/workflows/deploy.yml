# SPDX-License-Identifier: LicenseRef-PYRAX-Proprietary
# Build all site/service images -> PRIVATE GHCR, then roll them out on the websites droplet.
# After the first launch, every push to main is a zero-downtime update (Caddy keeps serving while
# each container is recreated; nginx/static swaps are sub-second and Caddy retries the upstream).
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: website
            file: pyrax-website/Dockerfile
            context: .
          - name: nodes-website
            file: pyrax-nodes-website/Dockerfile
            context: .
          - name: explorer
            file: pyrax-explorer/Dockerfile
            context: .
          - name: explorer-indexer
            file: pyrax-explorer/server/Dockerfile
            context: pyrax-explorer/server
          - name: peer-directory
            file: pyrax-peer-directory/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: |
            ghcr.io/pyrax-network/pyrax-web-${{ matrix.name }}:latest
            ghcr.io/pyrax-network/pyrax-web-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync stack files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/pyrax-web"
      - name: Provision secret + pull + roll out
        uses: appleboy/ssh-action@v1.2.0
        # Secrets are passed as masked env vars (NOT interpolated into the script text), then forwarded
        # to the remote via `envs`. GitHub masks them in logs; nothing secret is committed.
        env:
          PYRAX_DIRECTORY_SECRET: ${{ secrets.PYRAX_DIRECTORY_SECRET }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: PYRAX_DIRECTORY_SECRET,GHCR_PULL_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/pyrax-web
            # Write the directory secret straight from the org secret into a root-only .env (umask 077).
            # Never committed, never echoed; the peer-directory container reads it via compose.
            umask 077
            printf 'PYRAX_DIRECTORY_SECRET=%s\n' "$PYRAX_DIRECTORY_SECRET" > .env
            # Authenticate to private GHCR via stdin, roll out, then drop the cached credential so no
            # registry token is left at rest on the droplet.
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f
