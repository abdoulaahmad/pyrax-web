# SPDX-License-Identifier: LicenseRef-PYRAX-Proprietary
# Build all site/service images -> PRIVATE GHCR, then roll them out on the websites droplet.
# After the first launch, every push to main is a zero-downtime update (Caddy keeps serving while
# each container is recreated; nginx/static swaps are sub-second and Caddy retries the upstream).
name: build-and-deploy

on:
  # MANUAL-ONLY: a push to main NEVER auto-deploys. Production rollout is a deliberate,
  # approved action (Actions tab -> Run workflow), so repos never deploy out of order or
  # before they're approved. CI/build validation runs on push via ci.yml.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: website
            file: pyrax-website/Dockerfile
            context: .
          - name: nodes-website
            file: pyrax-nodes-website/Dockerfile
            context: .
          - name: explorer
            file: pyrax-explorer/Dockerfile
            context: .
          - name: explorer-indexer
            file: pyrax-explorer/server/Dockerfile
            context: pyrax-explorer/server
          - name: peer-directory
            file: pyrax-peer-directory/Dockerfile
            context: .
          - name: team-pyrax
            file: team-pyrax/Dockerfile
            context: team-pyrax
          - name: relay
            file: relay/Dockerfile
            context: .
          - name: faucet
            file: faucet/Dockerfile
            context: .
          - name: caddy
            file: caddy/Dockerfile
            context: .
          - name: tunnel-relay
            file: pyrax-tunnel-relay/Dockerfile
            context: pyrax-tunnel-relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: |
            ghcr.io/pyrax-network/pyrax-web-${{ matrix.name }}:latest
            ghcr.io/pyrax-network/pyrax-web-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync stack files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/pyrax-web"
      - name: Provision secret + pull + roll out
        uses: appleboy/ssh-action@v1.2.0
        # Secrets are passed as masked env vars (NOT interpolated into the script text), then forwarded
        # to the remote via `envs`. GitHub masks them in logs; nothing secret is committed.
        env:
          PYRAX_DIRECTORY_SECRET: ${{ secrets.PYRAX_DIRECTORY_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          DATABASE_URL_TEAM_PYRAX: ${{ secrets.DATABASE_URL_TEAM_PYRAX }}
          DATABASE_URL_EXPLORER: ${{ secrets.DATABASE_URL_EXPLORER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          PYRAX_RELAY_SECRET: ${{ secrets.PYRAX_RELAY_SECRET }}
          PYRAX_KEY_PASSPHRASE: ${{ secrets.PYRAX_KEY_PASSPHRASE }}
          # Cloudflare token (Zone:DNS:Edit on pyraxchain.com) for Caddy's *.nodes DNS-01
          # wildcard origin cert; reuse the existing org token granted to this repo.
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Shared HMAC secret between the tunnel relay's /__admin plane and team-pyrax's
          # node-control (kill-switch) page. Set this org/repo secret to a random value.
          PYRAX_TUNNEL_ADMIN_SECRET: ${{ secrets.PYRAX_TUNNEL_ADMIN_SECRET }}
          # NOVA log-shipper + remediation agent on this droplet. NOVA_AGENT_SECRET MUST equal
          # the one set on the NOVA backend + producer droplet (else the agent exits + crash-
          # loops). NOVA_AGENT_REMEDIATION is an opt-in repo VARIABLE (0/1, default 0 = ship
          # logs only); set the repo variable to 1 to let NOVA auto-restart stateless containers.
          NOVA_AGENT_SECRET: ${{ secrets.NOVA_AGENT_SECRET }}
          NOVA_AGENT_REMEDIATION: ${{ vars.NOVA_AGENT_REMEDIATION }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: PYRAX_DIRECTORY_SECRET,SESSION_SECRET,BREVO_API_KEY,SPACES_KEY,SPACES_SECRET,DATABASE_URL_TEAM_PYRAX,DATABASE_URL_EXPLORER,GHCR_PULL_TOKEN,GHCR_USER,PYRAX_RELAY_SECRET,PYRAX_KEY_PASSPHRASE,CLOUDFLARE_DNS_TOKEN,PYRAX_TUNNEL_ADMIN_SECRET,NOVA_AGENT_SECRET,NOVA_AGENT_REMEDIATION
          script: |
            set -euo pipefail
            cd /opt/pyrax-web
            # Write every app secret from GitHub secrets into a root-only .env (umask 077). Never
            # committed, never echoed; compose injects them per-service. Optional ones default to empty,
            # and each service degrades gracefully (peer-directory needs PYRAX_DIRECTORY_SECRET; team-pyrax
            # falls back to an ephemeral session key / log-only email / public downloads when unset).
            umask 077
            {
              printf 'PYRAX_DIRECTORY_SECRET=%s\n' "${PYRAX_DIRECTORY_SECRET:-}"
              printf 'SESSION_SECRET=%s\n' "${SESSION_SECRET:-}"
              printf 'BREVO_API_KEY=%s\n' "${BREVO_API_KEY:-}"
              printf 'SPACES_KEY=%s\n' "${SPACES_KEY:-}"
              printf 'SPACES_SECRET=%s\n' "${SPACES_SECRET:-}"
              printf 'DATABASE_URL_TEAM_PYRAX=%s\n' "${DATABASE_URL_TEAM_PYRAX:-}"
              printf 'DATABASE_URL_EXPLORER=%s\n' "${DATABASE_URL_EXPLORER:-}"
              # On-chain events relayer: team-pyrax reaches it internally; both it and
              # the relay share PYRAX_RELAY_SECRET. Empty -> relay idles, logins still work.
              printf 'RELAY_BASE=%s\n' "http://relay:8799"
              printf 'PYRAX_RELAY_SECRET=%s\n' "${PYRAX_RELAY_SECRET:-}"
              printf 'PYRAX_KEY_PASSPHRASE=%s\n' "${PYRAX_KEY_PASSPHRASE:-}"
              # Tunnel relay: Caddy DNS-01 wildcard cert token + the admin/kill HMAC secret
              # (shared with team-pyrax, which reads it from this same .env).
              printf 'CLOUDFLARE_DNS_TOKEN=%s\n' "${CLOUDFLARE_DNS_TOKEN:-}"
              printf 'PYRAX_TUNNEL_ADMIN_SECRET=%s\n' "${PYRAX_TUNNEL_ADMIN_SECRET:-}"
              # NOVA agent: the shared bearer (MUST match the NOVA backend) + the opt-in
              # auto-restart toggle (default 0 = ship logs only). Empty secret -> the agent
              # idles? no — it exits; so this MUST be set (see the deploy runbook).
              printf 'NOVA_AGENT_SECRET=%s\n' "${NOVA_AGENT_SECRET:-}"
              printf 'NOVA_AGENT_REMEDIATION=%s\n' "${NOVA_AGENT_REMEDIATION:-0}"
            } > .env
            # Authenticate to private GHCR via stdin, roll out, then drop the cached credential so no
            # registry token is left at rest on the droplet.
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            # Caddy bind-mounts the Caddyfile, so `up -d` does NOT restart it when only the Caddyfile
            # changed (e.g. a new subdomain route). Restart Caddy only when its content changed, so new
            # routes load + their certs provision automatically — no manual reload, no blip on no-op deploys.
            if [ "$(sha256sum Caddyfile | cut -d' ' -f1)" != "$(cat .caddyfile.sha 2>/dev/null || true)" ]; then
              echo "Caddyfile changed — restarting Caddy to load new routes"
              docker compose restart caddy
              sha256sum Caddyfile | cut -d' ' -f1 > .caddyfile.sha
            fi
            docker logout ghcr.io || true
            docker image prune -f
