# SPDX-License-Identifier: LicenseRef-PYRAX-Proprietary
# Build + validation gate for every site/service in this repo. Runs on EVERY push and
# pull request to main — it never deploys (deploy.yml is manual-only / workflow_dispatch),
# so a broken build is caught before anyone clicks "Run workflow" to roll out.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-flight CI run (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each front-end / service package is built + typechecked independently with its own
  # lockfile + package manager. fail-fast:false so one broken package doesn't mask others.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: pyrax-website, pm: pnpm }
          - { dir: pyrax-nodes-website, pm: npm }
          - { dir: pyrax-explorer, pm: npm }
          - { dir: pyrax-explorer/server, pm: npm }
          - { dir: pyrax-peer-directory, pm: pnpm }
          - { dir: team-pyrax, pm: pnpm }
    name: build (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack (pnpm)
        if: matrix.pm == 'pnpm'
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (pnpm)
        if: matrix.pm == 'pnpm'
        working-directory: ${{ matrix.dir }}
        run: pnpm install --frozen-lockfile
      - name: Install (npm)
        if: matrix.pm == 'npm'
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm }} run --if-present typecheck
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm }} run --if-present build
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm }} run --if-present test

  # The faucet + relay are dependency-free ESM services (no package.json / build step).
  # Syntax-check them so a typo can't ship to the droplet on the next manual deploy.
  scripts-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --check the standalone services
        run: |
          set -euo pipefail
          for f in faucet/*.mjs relay/*.mjs pyrax-tunnel-relay/*.mjs; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
